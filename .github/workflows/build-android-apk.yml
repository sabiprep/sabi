name: Build SABI Android APK

on:
  # Keep native compilation paused unless explicitly requested.
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile SABI JAMB CBT Android APK
    runs-on: ubuntu-latest
    # The API is deployed by Vercel alongside the web app. Allow an explicit
    # secret/variable override, but keep native builds functional by default.
    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL || 'https://sabi-tan.vercel.app' }}

    steps:
      - name: Checkout SABI Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 (Required for Capacitor 8 / Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Verify the APK has an absolute API base URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Repository secret VITE_API_BASE_URL is not set. An APK cannot call a relative /api path. Set VITE_API_BASE_URL to the deployed SABI API origin."
            exit 1
          fi
          case "$VITE_API_BASE_URL" in
            *ais-pre-*|*ais-dev-*)
              echo "::error::VITE_API_BASE_URL points at an AI Studio preview proxy, which does not serve the SABI API (it redirects /api/* to /__cookie_check.html). Set the secret to the real API origin."
              exit 1
              ;;
          esac
          echo "APK will call the SABI API at: $VITE_API_BASE_URL"

      - name: Verify deployed SABI API health
        run: |
          node --input-type=module -e '
            const rawBase = process.env.VITE_API_BASE_URL;
            const base = rawBase.endsWith("/") ? rawBase.slice(0, -1) : rawBase;
            let lastFailure = "No response";
            for (let attempt = 1; attempt <= 18; attempt += 1) {
              try {
                const response = await fetch(`${base}/api/health`, { signal: AbortSignal.timeout(15000) });
                const type = response.headers.get("content-type") || "";
                const body = await response.text();
                console.log(`SABI API health attempt ${attempt}: HTTP ${response.status} ${body}`);
                if (response.ok && type.includes("application/json")) {
                  console.log(`SABI API health endpoint reachable: ${base}/api/health`);
                  process.exit(0);
                }
                lastFailure = `HTTP ${response.status}, content-type=${type}, body=${body}`;
              } catch (error) {
                lastFailure = error instanceof Error ? error.message : String(error);
                console.log(`SABI API health attempt ${attempt}: ${lastFailure}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`SABI API did not become healthy after waiting for Vercel deployment: ${lastFailure}`);
          '

      - name: Build Production Web Bundle, Ensure Android Wrapper & Sync Capacitor
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run android:sync

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Assemble Installable Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload SABI Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SABI-JAMB-CBT-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
