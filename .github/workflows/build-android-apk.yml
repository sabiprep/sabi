name: Build SABI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile SABI JAMB CBT Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SABI Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 (Required for Capacitor 8 / Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Verify the APK has an absolute API base URL
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Repository secret VITE_API_BASE_URL is not set. An APK cannot call a relative /api path, so it must be built against the deployed API origin (e.g. https://sabi-api-xxxx.europe-west1.run.app)."
            exit 1
          fi
          case "$VITE_API_BASE_URL" in
            *ais-pre-*|*ais-dev-*)
              echo "::error::VITE_API_BASE_URL points at an AI Studio preview proxy, which does not serve the SABI API (it redirects /api/* to /__cookie_check.html). Set the secret to the real API origin."
              exit 1
              ;;
          esac
          echo "APK will call the SABI API at: $VITE_API_BASE_URL"

      - name: Build Production Web Bundle, Ensure Android Wrapper & Sync Capacitor
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run android:sync

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Assemble Installable Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload SABI Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SABI-JAMB-CBT-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
