name: Backend CI

on:
  push:
    branches:
      - main
      - 'backend/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sabi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sabi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sabi_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build web and API
        run: npm run build
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Prepare disposable Phase 0 schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/phase1_foundation_fixture.sql
      - name: Apply Phase 1 migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0002_phase1_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0003_profile_privilege_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0004_profile_public_acl_hardening.sql
      - name: Verify Phase 1 schema and security
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/phase1_foundation_assertions.sql
      - name: Prepare disposable question bank
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/phase2_learning_fixture.sql
      - name: Apply Phase 1 learning and Phase 2 migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107000000_core_learning_attempts_and_mastery.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107003000_learning_data_read_policies.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107004500_support_full_utme_cbt_sessions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108120000_phase2_adaptive_learning.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108123000_phase2_atomic_mastery_upsert.sql
      - name: Verify Phase 2 adaptive learning behaviour
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/phase2_adaptive_learning_assertions.sql
      - name: Verify Phase 1/2 migrations are idempotent
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0002_phase1_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0003_profile_privilege_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0004_profile_public_acl_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108120000_phase2_adaptive_learning.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108123000_phase2_atomic_mastery_upsert.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/phase1_foundation_assertions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/phase2_adaptive_learning_assertions.sql
      - name: Apply Phase 1.5 intelligence data layer
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108150000_phase1_5_intelligence_data_layer.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seeds/phase1_5_engine_registry.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seeds/2026_jamb_subject_catalogue.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seeds/simulation_personas.sql
      - name: Verify Phase 1.5 intelligence data layer
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/phase1_5_intelligence_assertions.sql
