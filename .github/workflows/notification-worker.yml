name: Sabi notification worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sabi-notification-worker
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch due notifications
        env:
          WORKER_URL: ${{ secrets.SABI_NOTIFICATION_WORKER_URL }}
          WORKER_SECRET: ${{ secrets.NOTIFICATION_WORKER_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$WORKER_URL" || -z "$WORKER_SECRET" ]]; then
            echo "Notification worker credentials are not configured; safely skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 90 \
            -X POST "${WORKER_URL%/}/api/internal/notifications/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-sabi-notification-secret: $WORKER_SECRET" \
            --data '{"limit":25}'
