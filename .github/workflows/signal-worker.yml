name: Sabi Signal and Engine Worker

# Operational worker, not release CI. It must never gate a commit: `Backend CI`
# is the required check on `main`. While the worker secrets are absent this job
# skips with a warning annotation instead of failing, so an unconfigured worker
# cannot paint every commit on `main` red (previously it ran on push and could
# not pass at all, which made the branch-protection check meaningless).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sabi-signal-worker
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      SABI_SIGNAL_WORKER_URL: ${{ secrets.SABI_SIGNAL_WORKER_URL }}
      SIGNAL_WORKER_SECRET: ${{ secrets.SIGNAL_WORKER_SECRET }}
    steps:
      - name: Run signal and engine worker
        if: ${{ env.SABI_SIGNAL_WORKER_URL != '' && env.SIGNAL_WORKER_SECRET != '' }}
        run: |
          case "$SABI_SIGNAL_WORKER_URL" in
            https://*) ;;
            *) echo "SABI_SIGNAL_WORKER_URL must use HTTPS"; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 25 \
            -X POST \
            -H "Authorization: Bearer $SIGNAL_WORKER_SECRET" \
            "$SABI_SIGNAL_WORKER_URL/api/internal/dispatch-signals"

      - name: Skip when worker secrets are missing
        if: ${{ env.SABI_SIGNAL_WORKER_URL == '' || env.SIGNAL_WORKER_SECRET == '' }}
        run: |
          echo "::warning::Signal worker dispatch is disabled. Configure SABI_SIGNAL_WORKER_URL and SIGNAL_WORKER_SECRET in GitHub repository Actions secrets."
